<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="30%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#ea580c" stroke-width="8" stroke-opacity="0.6" />

  <!-- Outer Energy Glow Aura -->
  <circle cx="256" cy="256" r="160" fill="#ea580c" opacity="0.2" filter="url(#glow)" />

  <!-- Stylized Electric Spark / Lightning Bolt (ISKRA) -->
  <path 
    d="M296 48 L144 264 L248 264 L216 464 L368 232 L264 232 Z" 
    fill="url(#sparkGrad)" 
    filter="url(#glow)"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Bright Core Highlight -->
  <path 
    d="M286 90 L176 250 L254 250 L232 400 L340 244 L260 244 Z" 
    fill="#ffffff" 
    opacity="0.4"
  />

  <!-- Small Cyan Water Droplet (Plumbing Accent) -->
  <circle cx="360" cy="140" r="18" fill="url(#waterGrad)" />
  <circle cx="355" cy="135" r="5" fill="#ffffff" opacity="0.8" />
</svg>
